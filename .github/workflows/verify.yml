name: Verify portfolio project
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:browser-suite
      - run: npm run build
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm run test:rules
      - run: npx playwright install --with-deps chromium
      - run: npm run test:ui
      - name: Upload verified desktop and mobile screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: finstatement-pro-ui-screenshots
          path: |
            docs/dashboard.png
            docs/mobile.png
          if-no-files-found: ignore
